<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pro Football Career</title>
  <!-- Google Fonts: Titillium Web & Montserrat pour un look sportif style FC/FUT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Titillium+Web:wght@600;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: #121927;
      --accent-gold: #f3c623;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      padding-bottom: 24px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* En-tête */
    header {
      text-align: center;
      padding: 8px 0;
    }

    header h1 {
      font-family: 'Titillium Web', sans-serif;
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* --- ÉCRAN DE CRÉATION DE JOUEUR --- */
    .setup-screen {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent-blue);
    }

    /* Grille de sélection des postes */
    .positions-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .pos-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 4px;
      border-radius: 8px;
      font-family: 'Titillium Web', sans-serif;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .pos-btn.selected {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
      box-shadow: 0 0 10px rgba(243, 198, 35, 0.4);
    }

    /* --- ÉCRAN PRINCIPAL DU JEU --- */
    .game-screen {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    /* Carte FUT */
    .fut-card-wrapper {
      display: flex;
      justify-content: center;
      margin: 4px 0;
    }

    .fut-card {
      width: 240px;
      height: 350px;
      border-radius: 16px;
      padding: 18px 14px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease, background 0.5s ease;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .fut-card.bronze {
      background: linear-gradient(135deg, #4a3324 0%, #8c5a3c 50%, #2e1e14 100%);
      color: #f7d8c5;
    }
    .fut-card.silver {
      background: linear-gradient(135deg, #708090 0%, #c0c0c0 50%, #46525e 100%);
      color: #ffffff;
    }
    .fut-card.gold {
      background: linear-gradient(135deg, #e5a93b 0%, #fff0a8 50%, #996515 100%);
      color: #2a1a00;
    }
    .fut-card.special {
      background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 50%, #6366f1 100%);
      color: #ffffff;
      border-color: #a855f7;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .rating-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
    }

    .rating-val {
      font-family: 'Titillium Web', sans-serif;
      font-size: 42px;
      font-weight: 900;
    }

    .position-val {
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .player-avatar {
      font-size: 64px;
      line-height: 1;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    .player-name-banner {
      text-align: center;
      font-family: 'Titillium Web', sans-serif;
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 4px;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-label {
      opacity: 0.8;
      font-weight: 600;
      font-size: 11px;
    }

    .card-footer {
      display: flex;
      justify-content: space-around;
      font-size: 11px;
      font-weight: 700;
      opacity: 0.9;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 6px;
    }

    /* Panneaux */
    .panel {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid var(--border-color);
    }

    .panel-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .energy-bar-container {
      width: 100%;
      height: 12px;
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      overflow: hidden;
      margin-top: 6px;
    }

    .energy-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--accent-red) 0%, var(--accent-gold) 50%, var(--accent-green) 100%);
      transition: width 0.4s ease;
    }

    /* Actions */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 8px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-icon {
      font-size: 18px;
    }

    .btn-cost {
      font-size: 10px;
      color: var(--accent-gold);
      font-weight: 600;
    }

    .btn-primary {
      grid-column: span 2;
      background: linear-gradient(135deg, var(--accent-blue) 0%, #2563eb 100%);
      border: none;
      padding: 14px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-rest {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    /* Log */
    .log-container {
      height: 110px;
      overflow-y: auto;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    .log-item {
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--accent-blue);
      line-height: 1.4;
    }

    .reset-btn {
      background: transparent;
      border: none;
      color: var(--accent-red);
      font-size: 10px;
      text-decoration: underline;
      cursor: pointer;
      text-align: center;
      margin-top: 8px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Pro Football Career</h1>
      <p>Simulateur de Carrière & Progression</p>
    </header>

    <!-- ÉCRAN DE CRÉATION DU JOUEUR -->
    <div class="setup-screen" id="setupScreen">
      <div class="form-group">
        <label for="playerNameInput">Nom du Joueur</label>
        <input type="text" id="playerNameInput" class="form-input" placeholder="Ex: Alex Hunter" value="Alex Hunter">
      </div>

      <div class="form-group">
        <label>Choisissez votre Poste</label>
        <div class="positions-grid">
          <button class="pos-btn selected" onclick="selectPosition('BU', this)">BU</button>
          <button class="pos-btn" onclick="selectPosition('AG', this)">AG</button>
          <button class="pos-btn" onclick="selectPosition('AD', this)">AD</button>
          <button class="pos-btn" onclick="selectPosition('MOC', this)">MOC</button>
          <button class="pos-btn" onclick="selectPosition('MC', this)">MC</button>
          <button class="pos-btn" onclick="selectPosition('MDC', this)">MDC</button>
          <button class="pos-btn" onclick="selectPosition('DC', this)">DC</button>
          <button class="pos-btn" onclick="selectPosition('DD', this)">DD</button>
          <button class="pos-btn" onclick="selectPosition('DG', this)">DG</button>
          <button class="pos-btn" onclick="selectPosition('GK', this)">GK</button>
        </div>
      </div>

      <button class="btn btn-primary" style="margin-top: 10px;" onclick="createCareer()">
        🚀 Lancer ma carrière
      </button>
    </div>

    <!-- ÉCRAN DU JEU MAIN -->
    <div class="game-screen" id="gameScreen">
      <!-- Carte FUT Dynamique -->
      <div class="fut-card-wrapper">
        <div class="fut-card bronze" id="futCard">
          <div class="card-top">
            <div class="rating-block">
              <span class="rating-val" id="cardOvr">60</span>
              <span class="position-val" id="cardPos">BU</span>
            </div>
            <div class="player-avatar" id="cardAvatar">⚽</div>
          </div>

          <div>
            <div class="player-name-banner" id="cardName">Alex Hunter</div>
            <div class="card-stats-grid">
              <div class="stat-item"><span class="stat-label" id="lbl1">VIT</span><span id="stat1">60</span></div>
              <div class="stat-item"><span class="stat-label" id="lbl2">TIR</span><span id="stat2">60</span></div>
              <div class="stat-item"><span class="stat-label" id="lbl3">PAS</span><span id="stat3">60</span></div>
              <div class="stat-item"><span class="stat-label" id="lbl4">DRI</span><span id="stat4">60</span></div>
              <div class="stat-item"><span class="stat-label" id="lbl5">DEF</span><span id="stat5">40</span></div>
              <div class="stat-item"><span class="stat-label" id="lbl6">PHY</span><span id="stat6">60</span></div>
            </div>
          </div>

          <div class="card-footer">
            <span id="cardClub">FC Bordeaux</span>
            <span id="cardAge">16 ans</span>
          </div>
        </div>
      </div>

      <!-- État physique & Statistiques -->
      <div class="panel">
        <div class="panel-title">
          <span>Forme & Énergie</span>
          <span id="energyVal" style="color: var(--accent-green);">100%</span>
        </div>
        <div class="energy-bar-container">
          <div class="energy-bar-fill" id="energyBar"></div>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px;">
          <span>Matchs: <strong id="matchCount">0</strong></span>
          <span id="mainStatLabel">Buts: <strong id="goalCount">0</strong></span>
        </div>
      </div>

      <!-- Centre d'entraînement -->
      <div class="panel">
        <div class="panel-title">Centre d'entraînement</div>
        <div class="actions-grid">
          <button class="btn btn-primary" onclick="playMatch()">
            <span class="btn-icon">⚽</span>
            <span>Jouer le prochain match</span>
            <span class="btn-cost">-25% Énergie</span>
          </button>

          <button class="btn" onclick="train('offensive')">
            <span class="btn-icon">🎯</span>
            <span id="trainBtn1">Entraînement Attaque</span>
            <span class="btn-cost">-15% Énergie</span>
          </button>

          <button class="btn" onclick="train('defensive')">
            <span class="btn-icon">⚡</span>
            <span id="trainBtn2">Entraînement Physique</span>
            <span class="btn-cost">-15% Énergie</span>
          </button>

          <button class="btn btn-rest" onclick="rest()" style="grid-column: span 2;">
            <span class="btn-icon">🛌</span>
            <span>Se reposer / Récupérer</span>
            <span class="btn-cost" style="color: var(--accent-green);">+40% Énergie</span>
          </button>
        </div>
      </div>

      <!-- Journal -->
      <div class="panel">
        <div class="panel-title">Actualités de la carrière</div>
        <div class="log-container" id="logContainer"></div>
      </div>

      <button class="reset-btn" onclick="resetGame()">Réinitialiser la carrière</button>
    </div>
  </div>

  <script>
    let selectedPos = "BU";

    // Profils de statistiques initiales selon le poste
    const positionProfiles = {
      BU:  { stats: { vit: 65, tir: 66, pas: 55, dri: 62, def: 35, phy: 60 }, avatar: "⚽" },
      AG:  { stats: { vit: 72, tir: 62, pas: 60, dri: 68, def: 35, phy: 52 }, avatar: "⚡" },
      AD:  { stats: { vit: 72, tir: 62, pas: 60, dri: 68, def: 35, phy: 52 }, avatar: "⚡" },
      MOC: { stats: { vit: 64, tir: 63, pas: 68, dri: 67, def: 42, phy: 54 }, avatar: "🎩" },
      MC:  { stats: { vit: 60, tir: 58, pas: 66, dri: 62, def: 58, phy: 62 }, avatar: "🧠" },
      MDC: { stats: { vit: 58, tir: 48, pas: 62, dri: 56, def: 66, phy: 68 }, avatar: "🛡️" },
      DC:  { stats: { vit: 56, tir: 35, pas: 50, dri: 48, def: 68, phy: 70 }, avatar: "🧱" },
      DD:  { stats: { vit: 68, tir: 45, pas: 58, dri: 58, def: 62, phy: 62 }, avatar: "🏃" },
      DG:  { stats: { vit: 68, tir: 45, pas: 58, dri: 58, def: 62, phy: 62 }, avatar: "🏃" },
      GK:  { stats: { plongeon: 64, jeuMain: 62, degagement: 60, reflexe: 66, vitesse: 45, placement: 63 }, avatar: "🧤" }
    };

    let player = JSON.parse(localStorage.getItem('pro_career_save')) || null;

    function selectPosition(pos, btnEl) {
      selectedPos = pos;
      document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('selected'));
      btnEl.classList.add('selected');
    }

    function createCareer() {
      const nameInput = document.getElementById('playerNameInput').value.trim() || "Alex Hunter";
      const profile = positionProfiles[selectedPos];

      player = {
        name: nameInput,
        club: "FC Bordeaux",
        position: selectedPos,
        age: 16,
        energy: 100,
        matchs: 0,
        goals: 0,
        cleanSheets: 0,
        stats: { ...profile.stats },
        avatar: profile.avatar,
        logs: [`Début de carrière professionnelle en tant que ${selectedPos} !`]
      };

      saveGame();
      initGameScreen();
    }

    function saveGame() {
      localStorage.setItem('pro_career_save', JSON.stringify(player));
    }

    function calculateOVR() {
      const s = player.stats;
      const values = Object.values(s);
      const sum = values.reduce((a, b) => a + b, 0);
      return Math.round(sum / values.length);
    }

    function initGameScreen() {
      document.getElementById('setupScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'flex';
      updateUI();
    }

    function updateUI() {
      if (!player) return;

      const ovr = calculateOVR();
      const isGK = player.position === "GK";

      document.getElementById('cardOvr').textContent = ovr;
      document.getElementById('cardPos').textContent = player.position;
      document.getElementById('cardName').textContent = player.name;
      document.getElementById('cardClub').textContent = player.club;
      document.getElementById('cardAge').textContent = player.age + " ans";
      document.getElementById('cardAvatar').textContent = player.avatar || "⚽";

      // Adaptation des libellés de stats sur la carte (GK vs Joueur de champ)
      const keys = Object.keys(player.stats);
      if (isGK) {
        document.getElementById('lbl1').textContent = "PLO";
        document.getElementById('lbl2').textContent = "J.M";
        document.getElementById('lbl3').textContent = "DEG";
        document.getElementById('lbl4').textContent = "REF";
        document.getElementById('lbl5').textContent = "VIT";
        document.getElementById('lbl6').textContent = "PLA";

        document.getElementById('mainStatLabel').innerHTML = `Clean Sheets: <strong>${player.cleanSheets || 0}</strong>`;
        document.getElementById('trainBtn1').textContent = "Entraînement Réflexe";
        document.getElementById('trainBtn2').textContent = "Entraînement Plongeon";
      } else {
        document.getElementById('lbl1').textContent = "VIT";
        document.getElementById('lbl2').textContent = "TIR";
        document.getElementById('lbl3').textContent = "PAS";
        document.getElementById('lbl4').textContent = "DRI";
        document.getElementById('lbl5').textContent = "DEF";
        document.getElementById('lbl6').textContent = "PHY";

        document.getElementById('mainStatLabel').innerHTML = `Buts: <strong>${player.goals}</strong>`;
        document.getElementById('trainBtn1').textContent = "Entraînement Attaque";
        document.getElementById('trainBtn2').textContent = "Entraînement Defense/Phy";
      }

      document.getElementById('stat1').textContent = player.stats[keys[0]];
      document.getElementById('stat2').textContent = player.stats[keys[1]];
      document.getElementById('stat3').textContent = player.stats[keys[2]];
      document.getElementById('stat4').textContent = player.stats[keys[3]];
      document.getElementById('stat5').textContent = player.stats[keys[4]];
      document.getElementById('stat6').textContent = player.stats[keys[5]];

      document.getElementById('energyVal').textContent = player.energy + "%";
      document.getElementById('energyBar').style.width = player.energy + "%";
      document.getElementById('matchCount').textContent = player.matchs;

      // Type de Carte
      const card = document.getElementById('futCard');
      card.className = "fut-card";
      if (ovr >= 85) card.classList.add("special");
      else if (ovr >= 75) card.classList.add("gold");
      else if (ovr >= 65) card.classList.add("silver");
      else card.classList.add("bronze");

      // Logs
      const logContainer = document.getElementById('logContainer');
      logContainer.innerHTML = player.logs.map(log => `<div class="log-item">${log}</div>`).join('');
    }

    function addLog(msg) {
      player.logs.unshift(msg);
      if (player.logs.length > 15) player.logs.pop();
      saveGame();
      updateUI();
    }

    function playMatch() {
      if (player.energy < 25) {
        alert("Vous êtes trop fatigué pour jouer ! Reposez-vous.");
        return;
      }

      player.energy = Math.max(0, player.energy - 25);
      player.matchs++;
      const ovr = calculateOVR();
      let logMsg = `Match #${player.matchs}: `;

      if (player.position === "GK") {
        const cleanSheet = Math.random() < (ovr / 110);
        if (cleanSheet) {
          player.cleanSheets = (player.cleanSheets || 0) + 1;
          logMsg += "🧤 Clean Sheet ! Aucun but encaissé.";
        } else {
          logMsg += "Match disputé, quelques arrêts décisifs.";
        }
      } else {
        const scored = Math.random() < (ovr / 120);
        if (scored) {
          player.goals++;
          logMsg += "⚽ But marqué ! Excellente prestation.";
        } else {
          logMsg += "Match solide sans marquer.";
        }
      }

      addLog(logMsg);
    }

    function train(type) {
      if (player.energy < 15) {
        alert("Pas assez d'énergie pour s'entraîner.");
        return;
      }

      player.energy -= 15;
      const keys = Object.keys(player.stats);

      if (type === 'offensive') {
        player.stats[keys[1]] += 1; // Tir ou JeuMain
        addLog(`🎯 Entraînement réussi : +1 ${keys[1].toUpperCase()}`);
      } else {
        player.stats[keys[0]] += 1; // Vit ou Plongeon
        addLog(`⚡ Entraînement réussi : +1 ${keys[0].toUpperCase()}`);
      }

      saveGame();
      updateUI();
    }

    function rest() {
      if (player.energy >= 100) {
        alert("Vous êtes déjà en pleine forme !");
        return;
      }
      player.energy = Math.min(100, player.energy + 40);
      addLog("🛌 Repos effectué. Énergie récupérée.");
      saveGame();
      updateUI();
    }

    function resetGame() {
      if (confirm("Voulez-vous réinitialiser votre carrière et créer un nouveau joueur ?")) {
        localStorage.removeItem('pro_career_save');
        player = null;
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('setupScreen').style.display = 'flex';
      }
    }

    // Lancement au chargement
    if (player) {
      initGameScreen();
    } else {
      document.getElementById('setupScreen').style.display = 'flex';
    }
  </script>
</body>
</html>
